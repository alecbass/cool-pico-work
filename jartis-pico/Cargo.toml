[package]
edition = "2024"
name = "jartis-pico"
version = "0.1.0"
build = "build.rs"

crate-type = "bin"

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

embedded-hal = { workspace = true }
embedded-hal-nb = { workspace = true }

# Shared with jartis so we can use pins and such
rp-pico = { workspace = true }

jartis = { path = "../jartis" }

# For unit conversions
fugit = { workspace = true }
heapless = { workspace = true }

# CYW43 Wireless Functionality
# rp-pac = { version = "7.0.0", features = ["rp2040", "rt"] }
# embassy-embedded-hal = { version = "0.3.0",  features = ["defmt"] }
# embassy-sync = { version = "0.7.0", features = ["defmt"] }
# embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
# embassy-time = { version = "0.4.0",  features = ["defmt", "defmt-timestamp-uptime"] }
# # Disable the "rt" feature to let cortex-m-rt populate the INTERRUPTS symbol
# embassy-rp = { version = "0.4.0", features = ["defmt", "unstable-pac", "time-driver", "rp2040"], default-features = false }
# embassy-usb = { version = "0.4.0", features = ["defmt"] }
# embassy-net = { version = "0.7.0", features = ["defmt", "icmp", "tcp", "udp", "raw", "dhcpv4", "medium-ethernet", "dns", "proto-ipv4", "proto-ipv6", "multicast"] }
# embassy-net-wiznet = { version = "0.2.0", features = ["defmt"] }
# embassy-futures = "0.1.0"
# embassy-usb-logger = "0.4.0"
# cyw43 = { version = "0.3.0", features = ["defmt", "firmware-logs", "bluetooth"] }
# cyw43-pio = { version = "0.4.0", features = ["defmt"] }
# static_cell = "2.1"

# Logging
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true }

[features]
default = ["wireless"]
rfid_flasher = []
wireless = [
  # "dep:rp-pac",
  # "dep:embassy-embedded-hal",
  # "dep:embassy-sync",
  # "dep:embassy-executor",
  # "dep:embassy-time",
  # "dep:embassy-rp",
  # "dep:embassy-usb",
  # "dep:embassy-net",
  # "dep:embassy-net-wiznet",
  # "dep:embassy-futures",
  # "dep:embassy-usb-logger",
  # "dep:cyw43",
  # "dep:cyw43-pio",
  # "dep:static_cell",
  # "dep:critical-section"
]

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3

