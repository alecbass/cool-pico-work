[package]
edition = "2024"
name = "jartis-pico"
version = "0.1.0"
build = "build.rs"

crate-type = "bin"

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

embedded-hal = { workspace = true }
embedded-hal-nb = { workspace = true }

# Shared with jartis so we can use pins and such
rp-pico = { workspace = true }

jartis = { path = "../jartis" }

# For unit conversions
fugit = { workspace = true }
heapless = { workspace = true }

# CYW43 WiFi driver
embassy-embedded-hal = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embassy-rp = { workspace = true, optional = true }
embassy-usb = { workspace = true, optional = true }
embassy-net = { workspace = true, optional = true }
embassy-net-wiznet = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-usb-logger = { workspace = true, optional = true }
cyw43 = { workspace = true, optional = true }
cyw43-pio = { workspace = true, optional = true }
static_cell = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true }

[features]
default = ["wireless"]
rfid_flasher = []
wireless = [
  "dep:embassy-embedded-hal",
  "dep:embassy-sync",
  "dep:embassy-executor",
  "dep:embassy-time",
  "dep:embassy-rp",
  "dep:embassy-usb",
  "dep:embassy-net",
  "dep:embassy-net-wiznet",
  "dep:embassy-futures",
  "dep:embassy-usb-logger",
  "dep:cyw43",
  "dep:cyw43-pio",
  "dep:static_cell",
  "dep:critical-section",
  "dep:defmt",
  "dep:defmt-rtt",
  "dep:panic-probe"
]

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3

