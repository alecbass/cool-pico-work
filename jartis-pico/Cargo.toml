[package]
edition = "2024"
name = "cool-pico-work"
version = "0.1.0"
build = "build.rs"

crate-type = "bin"

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }

embedded-hal = { workspace = true }
embedded-hal-nb = { workspace = true }

# Shared with jartis so we can use pins and such
rp-pico = { workspace = true }

jartis = { path = "../jartis" }

# For unit conversions
fugit = { workspace = true }
heapless = { workspace = true }

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3

[features]
default = ["rfid_flasher"]
rfid_flasher = []
